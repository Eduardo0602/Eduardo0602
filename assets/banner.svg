<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Eduardo Araque · Mathematician · Statistics · Data Science</title>
  <desc id="d">Banner with a dark wine background, a normal density curve and faint mathematical symbols.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A0F17"/>
      <stop offset="0.55" stop-color="#7A1F2B"/>
      <stop offset="1" stop-color="#9C3341"/>
    </linearGradient>
    <linearGradient id="curva" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3D9DC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F3D9DC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F3D9DC" stop-opacity="0"/>
    </linearGradient>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#fondo)"/>
  <rect width="1200" height="300" rx="18" fill="url(#puntos)"/>

  <!-- Densidad normal: phi(x) escalada, centrada en x = 900 -->
  <path d="M 600 262 C 760 262, 800 250, 840 190 C 870 140, 880 95, 900 95 C 920 95, 930 140, 960 190 C 1000 250, 1040 262, 1200 262"
        fill="none" stroke="url(#curva)" stroke-width="3"/>
  <path d="M 840 190 C 870 140, 880 95, 900 95 C 920 95, 930 140, 960 190 L 960 262 L 840 262 Z"
        fill="#F3D9DC" fill-opacity="0.08"/>
  <line x1="600" y1="262" x2="1200" y2="262" stroke="#F3D9DC" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Símbolos matemáticos tenues -->
  <g font-family="'Cambria Math','STIX Two Math','Times New Roman',serif" fill="#FFFFFF" fill-opacity="0.13">
    <text x="1080" y="80" font-size="64">∑</text>
    <text x="700" y="110" font-size="54">∫</text>
    <text x="1120" y="200" font-size="40">∂</text>
    <text x="770" y="215" font-size="34">∀ε&gt;0</text>
    <text x="985" y="70" font-size="30">λ</text>
  </g>

  <!-- Texto -->
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="64" y="118" font-size="58" font-weight="700" fill="#FFFFFF">Eduardo Araque</text>
    <text x="66" y="162" font-size="26" fill="#F3D9DC">Mathematician · Statistics · Data Science</text>
    <text x="66" y="210" font-size="21" font-style="italic" fill="#FFFFFF" fill-opacity="0.92">I prove why a method works, then I make it work on real data.</text>
    <text x="66" y="252" font-size="17" fill="#F3D9DC" fill-opacity="0.85">Quito, Ecuador · UTC−5 · R · Python · SQL · LaTeX</text>
  </g>
</svg>
